<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Your Name</title>
    <meta name="description" content="Contact the developer behind this portfolio." />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="brand">Your Name</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav id="primary-navigation" class="site-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html" class="active" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow accent">Contact</p>
          <h1>Let's talk about your next digital project.</h1>
        </div>
      </section>

      <section class="section">
        <div class="container contact-grid">
          <div class="contact-card">
            <h2>Send a message</h2>
            <form class="contact-form" novalidate>
              <div class="form-group">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
              </div>
              <div class="form-group">
                <label for="message">Project details</label>
                <textarea id="message" name="message" placeholder="Tell me about your idea..." minlength="10" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Inquiry</button>
              <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
            </form>
          </div>

          <aside class="info-card">
            <h2>Get in touch</h2>
            <ul>
              <li><strong>Email:</strong> <a href="mailto:your.email@example.com">your.email@example.com</a></li>
            </ul>
            <div class="availability-box">
              <span class="dot"></span>
              Available for freelance and contract work
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>&copy; <span id="year"></span> Your Name</p>
        <div class="socials">
          <a href="mailto:your.email@example.com">Email</a>
        </div>
      </div>
    </footer>

    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script src="../assets/js/validation.js"></script>
  </body>
</html>
